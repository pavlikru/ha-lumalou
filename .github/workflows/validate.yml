name: Validate

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Home Assistant integration
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build HACS archive
        run: python scripts/build_hacs_zip.py lumalou.zip
      - name: Verify HACS archive layout
        shell: bash
        run: |
          set -euo pipefail
          listing="$(unzip -Z1 lumalou.zip)"

          for required in manifest.json __init__.py brand/icon.png; do
            if ! grep -Fxq "$required" <<<"$listing"; then
              echo "Missing $required at the archive root." >&2
              exit 1
            fi
          done

          if grep -q '^custom_components/' <<<"$listing"; then
            echo "Archive must not contain a custom_components/ prefix." >&2
            exit 1
          fi

          if grep -Eq '(^|/)__pycache__/|\.(pyc|pyo)$' <<<"$listing"; then
            echo "Archive contains cache or bytecode files." >&2
            exit 1
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: lumalou
          path: lumalou.zip
