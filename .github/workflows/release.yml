name: Release

# Push a `vX.Y.Z` tag on a commit that is already on `main`. HACS installs the
# tagged source tree (hacs.json has no zip_release), so no archive is built.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require the tag to match the manifest version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r '.version // empty' custom_components/lumalou/manifest.json)"
          if [[ -z "$manifest_version" || "$manifest_version" == "0.0.0" ||
            "${TAG_NAME#v}" != "$manifest_version" ]]; then
            echo "Tag ${TAG_NAME} does not match manifest version '${manifest_version}'." >&2
            exit 1
          fi

      - name: Require a CHANGELOG entry
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          grep -q "^## \[${TAG_NAME#v}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [${TAG_NAME#v}]' section." >&2
            exit 1
          }

  validate:
    needs: check
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          # PEP 440 pre-releases (0.2.0b1, 0.2.0rc1) are published as
          # GitHub pre-releases; HACS shows them only with "Show beta" enabled.
          prerelease=()
          if [[ "$version" =~ [a-z] ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
