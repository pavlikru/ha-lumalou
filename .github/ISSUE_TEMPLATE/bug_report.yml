name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not post Bluetooth addresses, device fingerprints, exported profiles,
        schedules, private keys, tokens, or other personal data. The integration's
        diagnostics download is already redacted.
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Release tag, or branch and commit for a development install.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.2
    validations:
      required: true
  - type: input
    id: bluetooth-adapter
    attributes:
      label: Bluetooth adapter or proxy
      description: For example built-in Raspberry Pi adapter, USB dongle, ESPHome proxy.
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Lumalou firmware version
      description: Use “unknown” if it is not available.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Settings → Devices & services → Lumalou → ⋮ → Download diagnostics.
        Attach the file or paste its contents.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >-
        Enable debug logging for the integration and reproduce the problem.
      render: text
