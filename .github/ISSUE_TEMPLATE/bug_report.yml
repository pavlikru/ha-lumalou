name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Remove device addresses, private keys, tokens, and personal data from
        logs before submitting them.
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: 2026.9.2
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Lumalou firmware version
      description: Use “unknown” if it is not available.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
