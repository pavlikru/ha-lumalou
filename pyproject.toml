[project]
name = "ha-lumalou"
version = "0.0.0"
description = "Home Assistant custom integration for Fisher-Price Lumalou"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Pavel Maltsev" }]
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.9.2",
  "HAP-python==5.0.0",
  "base36==0.1.1",
  "ha-ffmpeg==3.2.2",
  "fnv-hash-fast==2.0.3",
  "homekit-audio-proxy==1.2.1",
  "lumalou-gld09==0.2.0",
  "mypy==1.18.2",
  "pre-commit==4.3.0",
  "PyTurboJPEG==1.8.3",
  "PyQRCode==1.2.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-homeassistant-custom-component==0.13.365",
  "ruff==0.16.8",
]

[tool.uv]
package = false

# Temporary: remove once lumalou-gld09 0.2.0 is published to PyPI.
[tool.uv.sources]
lumalou-gld09 = { git = "https://github.com/pavlikru/lumalou", rev = "c156880690903e664c7b5d8e65148bfded0debd1", subdirectory = "packages/python" }

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.lumalou --cov-report=term-missing"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
files = ["custom_components/lumalou"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["lumalou", "lumalou.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PYI", "RUF", "SIM", "UP"]
