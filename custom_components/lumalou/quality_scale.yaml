# Integration Quality Scale self-assessment.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
# hassfest only enforces this file for core integrations; it is kept here as an
# honest checklist. Mark a rule `done` only when the code in this directory
# satisfies it.
rules:
  # Bronze
  action-setup:
    status: done
    comment: Actions are registered in async_setup and reject unknown or unloaded entries.
  appropriate-polling:
    status: done
    comment: No polling. One BLE session stays open and the device pushes GLOBAL_STATE after every command and button press, and its clock every minute; commands never read back. Reconnects are driven by Home Assistant Bluetooth advertisement callbacks.
  brands:
    status: done
    comment: Local brand/icon.png and brand/icon@2x.png (Home Assistant 2026.3+).
  common-modules:
    status: done
    comment: coordinator.py owns BLE I/O; entity.py holds the shared base entity.
  config-flow-test-coverage:
    status: done
    comment: config_flow.py has 100% line and branch coverage, including discovery, manual, error, reconfigure and options paths.
  config-flow: done
  dependency-transparency:
    status: done
    comment: Exact pin lumalou-gld09==0.2.1 from PyPI; public MIT source at github.com/pavlikru/lumalou with a v0.2.1 tag.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id:
    status: done
    comment: Unique IDs derive from the entry unique ID (verified device fingerprint), which does not change with the Bluetooth address.
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The config flow connects and verifies the signed device identity before creating an entry.
  test-before-setup:
    status: exempt
    comment: The BLE night light may be unpowered or out of range at startup. The entry loads offline and entities stay unavailable until Home Assistant Bluetooth sees the device. An entry without a verified identity fails setup with a translated ConfigEntryError.
  unique-config-entry:
    status: done
    comment: Entries are unique by verified device fingerprint; flows also abort early for an already configured address before any connection.

  # Silver
  action-exceptions:
    status: done
    comment: Invalid input and user-state refusals (controls locked, maintenance, untrusted host clock) raise ServiceValidationError; device and restore failures raise translated HomeAssistantError.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: >-
      The coordinator logs device loss (Bluetooth unavailability or a failed
      connect) and return once each at info level.
  parallel-updates:
    status: done
    comment: Every platform sets PARALLEL_UPDATES = 0; the coordinator lock serializes all device I/O.
  reauthentication-flow:
    status: exempt
    comment: No credentials. A changed or replaced device is handled by the reconfigure flow.
  test-coverage:
    status: done
    comment: Every module is at or above 95% line and branch coverage.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: todo
    comment: A known device at a new BLE address is updated (address only, controls stay unlocked) after the user confirms the discovery and its signed identity is verified, or through Reconfigure; there is no automatic update from the advertisement alone.
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry represents exactly one Lumalou.
  entity-category: done
  entity-device-class:
    status: done
    comment: Connection is a connectivity binary sensor; profile sync status is an enum sensor; audio is a speaker. The clock brightness number has no matching device class.
  entity-disabled-by-default:
    status: todo
    comment: The firmware and profile sync status diagnostics are enabled by default.
  entity-translations: done
  exception-translations:
    status: done
    comment: Action, entity and coordinator errors shown to users are translated; only internal errors that are wrapped before reaching users stay English.
  icon-translations:
    status: todo
    comment: No icons.json yet.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One device per entry; removing the entry removes the device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration makes no HTTP requests.
  strict-typing:
    status: todo
    comment: mypy runs with check_untyped_defs, not strict mode, and the protocol library ships no type information.
