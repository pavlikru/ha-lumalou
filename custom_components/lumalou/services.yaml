export_profile:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: lumalou

import_profile:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: lumalou
    profile:
      required: true
      selector:
        object:
    expected_revision:
      required: true
      selector:
        number:
          min: 0
          mode: box

restore_profile:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: lumalou
    expected_revision:
      required: false
      selector:
        number:
          min: 0
          mode: box
